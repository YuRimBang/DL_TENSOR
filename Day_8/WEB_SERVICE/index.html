<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Level Prediction</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stress Level Prediction</h1>
    <form id="stressForm">
        <label for="humidity">Humidity (%)</label>
        <input type="number" id="humidity" name="humidity" placeholder="Enter humidity" required>

        <label for="temperature">Temperature (°C)</label>
        <input type="number" id="temperature" name="temperature" placeholder="Enter temperature" required>

        <label for="stepCount">Step Count</label>
        <input type="number" id="stepCount" name="stepCount" placeholder="Enter step count" required>

        <button type="submit">Predict Stress Level</button>
    </form>

    <div class="result" id="result"></div>
</div>

<script>
    document.getElementById('stressForm').addEventListener('submit', function(event) {
        event.preventDefault();

        let formData = new FormData(this);

        fetch('/predict', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').innerText = "Predicted Stress Level: " + data.stress_level;
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
